{{/*
deploy/helm/sw3/templates/deployments.yaml
Deployments for all enabled SW3 services.
*/}}

{{/* ── API Gateway ──────────────────────────────────────────────────────────── */}}
{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ include "sw3.namespace" . }}
  labels:
    {{- include "sw3.labels" . | nindent 4 }}
    {{- include "sw3.selectorLabels" (dict "component" "api-gateway" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      {{- include "sw3.selectorLabels" (dict "component" "api-gateway" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sw3.labels" . | nindent 8 }}
        {{- include "sw3.selectorLabels" (dict "component" "api-gateway" "context" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: api-gateway
          image: {{ include "sw3.image" (dict "image" .Values.apiGateway.image "global" .Values.global) }}
          imagePullPolicy: {{ include "sw3.pullPolicy" . }}
          ports:
            - name: http
              containerPort: {{ .Values.apiGateway.port }}
          envFrom:
            - configMapRef:
                name: sw3-config
            - secretRef:
                name: {{ include "sw3.secretName" . }}
          env:
            {{- range $k, $v := .Values.apiGateway.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
{{- end }}

