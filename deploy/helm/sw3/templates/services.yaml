{{/*
deploy/helm/sw3/templates/services.yaml
ClusterIP Services for all enabled SW3 services.
The Ingress routes external traffic to api-gateway and optionally dashboard.
*/}}

{{- if .Values.apiGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ include "sw3.namespace" . }}
  labels:
    {{- include "sw3.labels" . | nindent 4 }}
    {{- include "sw3.selectorLabels" (dict "component" "api-gateway" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sw3.selectorLabels" (dict "component" "api-gateway" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.apiGateway.port }}
      targetPort: http
{{- end }}

