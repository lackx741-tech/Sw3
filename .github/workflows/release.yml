# .github/workflows/release.yml
# Creates a GitHub release from a pushed semver tag (vMAJOR.MINOR.PATCH).
#
# Trigger:
#   - Push of a tag matching v*.*.*
#
# What it does:
#   1. Re-runs the core build verifications (pnpm + cargo + forge) so we
#      never publish a release built on broken code.
#   2. Extracts the matching section from CHANGELOG.md and uses it as the
#      release body.
#   3. Creates the GitHub Release (draft = false, prerelease = auto-detected
#      from the tag suffix, e.g. v0.2.0-rc.1).

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build before tagging release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.79.0"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev

      - name: pnpm install + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: cargo build
        run: cargo build --workspace

      - name: forge build (sweeper)
        run: forge build
        working-directory: contracts/sweeper

      - name: forge build (eip7702)
        run: forge build
        working-directory: contracts/eip7702

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          {
            echo "body<<__SW3_EOF__"
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { capture=1; next }
              capture && /^## \[/      { exit }
              capture                  { print }
            ' CHANGELOG.md
            echo "__SW3_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
