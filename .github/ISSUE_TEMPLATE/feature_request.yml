name: Feature request
description: Propose a new feature or enhancement
title: "[feat]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - apps
        - packages/sdk
        - packages/ui
        - services
        - contracts
        - infra / deploy
        - docs
        - CI / tooling
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
