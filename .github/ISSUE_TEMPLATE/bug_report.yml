name: Bug report
description: Report a reproducible bug in Sw3
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        **Do not** report security vulnerabilities here — see [`SECURITY.md`](../blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-paragraph description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, copy-pasteable steps.
      placeholder: |
        1. Run `make dev`
        2. POST /v1/sweeps with payload …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - apps/dashboard
        - apps/docs
        - apps/explorer
        - packages/sdk
        - packages/ui
        - services/api-gateway
        - services/auth-service
        - services/execution-engine
        - services/indexer-service
        - services/mempool-listener
        - services/rpc-router
        - services/simulation-engine
        - services/analytics-service
        - services/billing-service
        - contracts
        - infra / deploy
        - CI / tooling
        - other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / version
      placeholder: "e.g. v0.1.0 or commit dc2c05b"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Node:
        - pnpm:
        - Rust:
        - Docker:
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
